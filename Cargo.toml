[workspace]
members = ["tools/engram-fit"]

[package]
name = "engram"
version = "0.1.0"
edition = "2021"
description = "A low-power, self-consolidating memory gate: the hippocampus in front of your vector store."
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = []

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "hot_path"
harness = false

[profile.bench]
lto = true
codegen-units = 1
