[package]
name = "engram-fit"
version = "0.1.0"
edition = "2021"
description = "Fit engram to an embedding model: compute the frozen centering artifact, check anisotropy health, calibrate jaccard bands. Talks to any OpenAI-compatible /v1/embeddings endpoint (e.g. `mistralrs serve`), so it always uses the exact production engine."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
engram = { path = "../.." }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
